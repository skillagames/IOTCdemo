<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta name="theme-color" content="#ffffff" />
    <title>IoT Connect App</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background-color: #ffffff !important;
      }
      #root {
        background-color: #ffffff;
      }
    </style>
    <script>
      document.addEventListener('keydown', function (event) {
        if (event.ctrlKey === true || event.metaKey === true) {
          if (event.which === 61 || event.which === 107 || event.which === 173 || event.which === 109 || event.which === 187 || event.which === 189) {
            event.preventDefault();
          }
        }
      }, false);
      document.addEventListener('wheel', function (event) {
        if (event.ctrlKey === true || event.metaKey === true) {
          event.preventDefault();
        }
      }, { passive: false });
      document.addEventListener('touchstart', function (event) {
        if (event.touches.length > 1) {
          event.preventDefault();
        }
      }, { passive: false });
    </script>
  </head>
  <body>
    <div id="root">
      <div style="position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #ffffff; z-index: 9999;">
        <div style="font-family: system-ui, -apple-system, sans-serif; font-weight: 900; font-size: 10px; text-transform: uppercase; letter-spacing: 0.3em; color: #0f172a;">Synchronizing</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
