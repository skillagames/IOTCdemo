<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta name="theme-color" content="#3b82f6" />
    <title>IoT Connect App</title>
    <script>
      document.addEventListener('keydown', function (event) {
        if (event.ctrlKey === true || event.metaKey === true) {
          if (event.which === 61 || event.which === 107 || event.which === 173 || event.which === 109 || event.which === 187 || event.which === 189) {
            event.preventDefault();
          }
        }
      }, false);
      document.addEventListener('wheel', function (event) {
        if (event.ctrlKey === true || event.metaKey === true) {
          event.preventDefault();
        }
      }, { passive: false });
      document.addEventListener('touchstart', function (event) {
        if (event.touches.length > 1) {
          event.preventDefault();
        }
      }, { passive: false });
    </script>
  </head>
  <body style="background-color: white; margin: 0; padding: 0; overflow: hidden;">
    <!-- Static pre-loader outside root to prevent any blank WebView frames -->
    <div id="app-pre-loader" style="position: fixed; inset: 0; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: white; font-family: system-ui, -apple-system, sans-serif;">
      <div style="margin-bottom: 2rem; display: flex; height: 5rem; width: 5rem; align-items: center; justify-content: center; position: relative;">
        <!-- Static outer ring -->
        <div style="position: absolute; inset: 0; border-radius: 9999px; border: 3px solid #f1f5f9; border-top-color: #0f172a; animation: spin 1.5s linear infinite;"></div>
        <!-- Inner circle -->
        <div style="height: 3.5rem; width: 3.5rem; background-color: black; border-radius: 9999px; display: flex; align-items: center; justify-content: center; box-shadow: 0 25px 50px -12px rgba(15, 23, 42, 0.4);">
          <span style="font-weight: 900; font-size: 1.25rem; color: white; letter-spacing: -0.025em;">IO</span>
        </div>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center;">
        <span style="font-size: 10px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.3em; color: #0f172a;">Synchronizing</span>
      </div>
      <style>
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        body { background-color: white !important; }
      </style>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
